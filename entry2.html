<!DOCTYPE html>

<head>

  <style>
    body { background: #080808; color: #e0e0e0; font-family: monospace; padding: 40px 20px; max-width: 720px; margin: 0 auto; line-height: 1.7; }

</head>
<body>
  <a class="home-btn" href="index.html">⌂ INDEX</a>
  <h1>ENTRY 1 CONTINUED</h1>

<div style="
  display: inline-block;
  position: relative;
  max-width: 520px;
  width: 100%;
  margin: 1.5em 0;
">
  <!-- outer hull frame -->
  <div style="
    background: #0e0e16;
    border: 3px solid #2a2a3e;
    border-radius: 12px;
    padding: 18px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
  ">

    <!-- bolt corners -->
    <div style="position:absolute; top:8px; left:8px; width:10px; height:10px; border-radius:50%; background:#1a1a2a; border:1px solid #333;"></div>
    <div style="position:absolute; top:8px; right:8px; width:10px; height:10px; border-radius:50%; background:#1a1a2a; border:1px solid #333;"></div>
    <div style="position:absolute; bottom:8px; left:8px; width:10px; height:10px; border-radius:50%; background:#1a1a2a; border:1px solid #333;"></div>
    <div style="position:absolute; bottom:8px; right:8px; width:10px; height:10px; border-radius:50%; background:#1a1a2a; border:1px solid #333;"></div>

    <!-- portview window — oval cutout -->
    <div style="
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #222236;
      box-shadow:
        inset 0 0 40px rgba(0,0,0,0.9),
        0 0 0 6px #131320,
        0 0 0 8px #2a2a3e;
      aspect-ratio: 1 / 1;
    ">
      <img src="jupiteretc.jpg" style="
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        filter: brightness(0.9) contrast(1.1) saturate(1.1);
      ">
      <!-- subtle vignette over the window -->
      <div style="
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
        pointer-events: none;
      "></div>
    </div>

    <!-- HUD readout strip below window -->
    <div style="
      margin-top: 14px;
      border-top: 1px solid #1e1e2e;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 10px;
      color: #3a3a5a;
      letter-spacing: 0.08em;
    ">
      <span>PORT-VIEW 001</span>
      <span>DIST: 4.2 AU</span>
      <span>CAM-EXT-02</span>
    </div>

  </div>
</div>
